<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="Illustration of a bánh mì">
  <defs>
    <linearGradient id="crust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2B962"/>
      <stop offset="1" stop-color="#D88C33"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E0A04A"/>
      <stop offset="1" stop-color="#C47A27"/>
    </linearGradient>
  </defs>

  <ellipse cx="240" cy="266" rx="200" ry="14" fill="#221B14" opacity="0.1"/>

  <!-- bottom half of the roll -->
  <path d="M40 186 C40 170 80 166 240 166 C400 166 440 170 440 186 C440 220 390 240 240 240 C90 240 40 220 40 186Z" fill="url(#base)"/>
  <path d="M60 182 C120 176 360 176 420 182" fill="none" stroke="#F6D9A6" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- pork -->
  <path d="M48 168 C140 161 340 161 432 168 L434 184 C340 177 140 177 46 184Z" fill="#B4573E"/>
  <path d="M60 171 C150 166 330 166 420 171" fill="none" stroke="#7E3426" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 14"/>

  <!-- cucumber -->
  <rect x="70" y="160" width="130" height="9" rx="4.5" fill="#6FAE4F"/>
  <rect x="250" y="159" width="150" height="9" rx="4.5" fill="#6FAE4F"/>
  <rect x="76" y="162" width="118" height="2.5" rx="1.25" fill="#CFE8B0"/>
  <rect x="256" y="161" width="138" height="2.5" rx="1.25" fill="#CFE8B0"/>

  <!-- pickled carrot -->
  <rect x="24" y="150" width="70" height="9" rx="4.5" fill="#F28C28" transform="rotate(-14 59 154)"/>
  <rect x="30" y="162" width="56" height="8" rx="4" fill="#F59B3C" transform="rotate(-6 58 166)"/>
  <rect x="388" y="149" width="72" height="9" rx="4.5" fill="#F28C28" transform="rotate(12 424 153)"/>
  <rect x="394" y="161" width="56" height="8" rx="4" fill="#F59B3C" transform="rotate(5 422 165)"/>
  <rect x="150" y="156" width="60" height="8" rx="4" fill="#F28C28" transform="rotate(3 180 160)"/>
  <rect x="300" y="155" width="54" height="8" rx="4" fill="#F59B3C" transform="rotate(-3 327 159)"/>

  <!-- lettuce -->
  <path d="M40 158 q12 -14 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 L448 166 L40 166Z" fill="#4F9A3F"/>

  <!-- chilli -->
  <g>
    <circle cx="128" cy="157" r="7" fill="#D8352A"/>
    <circle cx="128" cy="157" r="3.2" fill="#F7E3C0"/>
    <circle cx="236" cy="155" r="7" fill="#D8352A"/>
    <circle cx="236" cy="155" r="3.2" fill="#F7E3C0"/>
    <circle cx="352" cy="157" r="7" fill="#D8352A"/>
    <circle cx="352" cy="157" r="3.2" fill="#F7E3C0"/>
  </g>

  <!-- coriander sprigs -->
  <g fill="#3E8B3A">
    <path d="M44 150 C30 140 22 132 16 122" fill="none" stroke="#3E8B3A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="16" cy="120" r="7"/>
    <circle cx="26" cy="128" r="6"/>
    <circle cx="10" cy="130" r="5.5"/>
    <path d="M436 152 C452 142 460 134 466 124" fill="none" stroke="#3E8B3A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="466" cy="122" r="7"/>
    <circle cx="456" cy="130" r="6"/>
    <circle cx="472" cy="132" r="5.5"/>
  </g>

  <!-- top half of the roll -->
  <path d="M44 140 C44 84 120 52 240 52 C360 52 436 84 436 140 C436 150 410 154 240 154 C70 154 44 150 44 140Z" fill="url(#crust)"/>
  <ellipse cx="205" cy="80" rx="120" ry="14" fill="#fff" opacity="0.16"/>

  <!-- scoring -->
  <g stroke-width="9" stroke-linecap="round" fill="none">
    <g stroke="#B9701F" opacity="0.55" transform="translate(0 4)">
      <path d="M96 109 L140 91"/>
      <path d="M158 93 L202 75"/>
      <path d="M218 87 L262 69"/>
      <path d="M278 93 L322 75"/>
      <path d="M340 109 L384 91"/>
    </g>
    <g stroke="#FADFA6">
      <path d="M96 109 L140 91"/>
      <path d="M158 93 L202 75"/>
      <path d="M218 87 L262 69"/>
      <path d="M278 93 L322 75"/>
      <path d="M340 109 L384 91"/>
    </g>
  </g>
</svg>
